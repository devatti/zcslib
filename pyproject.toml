[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zcslib"
version = "0.1.0"
description = "ZCS Azzurro API client - simple REST client to query ZCS Azzurro inverters"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
]

[tool.setuptools]
py-modules = ["zcslib"]